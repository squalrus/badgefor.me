<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #1a2340;
    color: #fff;
    position: relative;
  }

  /* Grid lines background */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Blue accent bar top */
  .accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #3b6bce, #5a8ee8, #3b6bce);
  }

  /* Badge card illustration */
  .badge-card {
    position: absolute;
    right: 96px;
    top: 50%;
    transform: translateY(-50%) rotate(8deg);
    width: 180px;
    height: 240px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 16px;
    gap: 10px;
  }

  .badge-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #e8edf8;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #dde3f0;
  }

  .badge-avatar svg {
    width: 44px;
    height: 44px;
    opacity: 0.4;
  }

  .badge-name {
    font-size: 13px;
    font-weight: 700;
    color: #1a2340;
    letter-spacing: 0.3px;
    text-align: center;
  }

  .badge-title {
    font-size: 10px;
    color: #8899bb;
    text-align: center;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-strip {
    margin-top: auto;
    width: 100%;
    height: 36px;
    background: repeating-linear-gradient(
      90deg,
      #1a1a1a 0px,
      #1a1a1a 3px,
      #333 3px,
      #333 6px
    );
    border-radius: 6px;
  }

  .badge-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3b6bce;
    box-shadow: 0 0 8px #3b6bce;
    margin-top: 4px;
  }

  /* Scanner glow */
  .scanner-line {
    position: absolute;
    right: 252px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 200px;
    background: linear-gradient(to bottom, transparent, rgba(59,107,206,0.15), rgba(59,107,206,0.4), rgba(59,107,206,0.15), transparent);
  }

  /* Main content */
  .content {
    position: absolute;
    left: 72px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 680px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5a8ee8;
    margin-bottom: 18px;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace;
  }

  .brand {
    font-size: 76px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    color: #fff;
    margin-bottom: 14px;
  }

  .brand span {
    color: #5a8ee8;
  }

  .tagline {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    margin-bottom: 36px;
    line-height: 1.4;
  }

  /* Pricing pill */
  .pricing {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 14px 22px;
    backdrop-filter: blur(4px);
  }

  .pricing-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace;
  }

  .pricing-divider {
    width: 1px;
    height: 28px;
    background: rgba(255,255,255,0.2);
  }

  .pricing-amount {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .pricing-per {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
  }

  .green-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4caf84;
    box-shadow: 0 0 6px #4caf84;
  }

  /* Domain label bottom right */
  .domain {
    position: absolute;
    bottom: 28px;
    right: 40px;
    font-size: 13px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="accent-bar"></div>

  <div class="content">
    <div class="eyebrow">Presence-as-a-Service™</div>
    <div class="brand">BadgeFor<span>.</span>Me</div>
    <div class="tagline">Your badge goes to the office.<br>You don't.</div>
    <div class="pricing">
      <div class="green-dot"></div>
      <div class="pricing-label">Starting at</div>
      <div class="pricing-divider"></div>
      <div class="pricing-amount">$20</div>
      <div class="pricing-per">/ week</div>
    </div>
  </div>

  <div class="scanner-line"></div>

  <div class="badge-card">
    <div class="badge-avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" fill="#8899bb"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="#8899bb"/>
      </svg>
    </div>
    <div>
      <div class="badge-name">Employee #4821</div>
      <div class="badge-title" style="margin-top:4px">Attendance Engineer</div>
    </div>
    <div class="badge-dot"></div>
    <div class="badge-strip"></div>
  </div>

  <div class="domain">badgefor.me</div>
</body>
</html>
